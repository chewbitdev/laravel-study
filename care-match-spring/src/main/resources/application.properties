# Laravel의 .env + config/*.php 역할

spring.application.name=care-match-spring
# Laravel(php artisan serve)은 8000, 이 프로젝트는 8080 → 둘을 동시에 켜서 비교할 수 있다
server.port=8080

# ── DB ───────────────────────────────────────────────
# H2 파일 DB: ./data/care-match.mv.db 파일 하나가 DB 전체 (Laravel의 database/database.sqlite 와 같은 역할)
# AUTO_SERVER=TRUE: 앱이 켜져 있어도 다른 프로그램(DB 툴)이 같은 파일에 접속할 수 있게 함
spring.datasource.url=jdbc:h2:file:./data/care-match;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# 테이블은 Flyway(src/main/resources/db/migration)가 만든다 = Laravel migration
# Hibernate는 엔티티와 테이블이 맞는지 "검사만" 한다 (validate). ddl-auto=update 같은 자동 변경은 쓰지 않는다.
spring.jpa.hibernate.ddl-auto=validate
# 지연 로딩을 서비스(트랜잭션) 안에서만 허용 → 컨트롤러에서 몰래 쿼리가 나가는 것을 막는다
spring.jpa.open-in-view=false

# 브라우저로 DB 보기: http://localhost:8080/h2-console  (JDBC URL은 위와 같은 값, user: sa)
spring.h2.console.enabled=true

# ── JSON ─────────────────────────────────────────────
# 요청/응답 JSON 키를 Laravel과 똑같이 snake_case로 (patientName ↔ patient_name)
spring.jackson.property-naming-strategy=SNAKE_CASE

# ── 페이징: Laravel paginate()와 같은 사용법으로 맞춤 ──
# ?page=1 부터 시작 (Spring 기본은 0부터)
spring.data.web.pageable.one-indexed-parameters=true
# ?per_page=10 (Spring 기본 파라미터 이름은 size)
spring.data.web.pageable.size-parameter=per_page
spring.data.web.pageable.default-page-size=15
spring.data.web.pageable.max-page-size=100
